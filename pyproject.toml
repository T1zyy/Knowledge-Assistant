[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Document ingestion and citation-backed question answering"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "psycopg[binary,pool]==3.3.2",
    "pydantic-settings==2.12.0",
    "pypdf==6.6.2",
    "python-multipart==0.0.22",
    "redis==7.1.0",
    "tiktoken==0.12.0",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a disposable PostgreSQL database with pgvector and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
