name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: assistant_test
          POSTGRES_PASSWORD: local-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant_test -d assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://assistant_test:local-ci-password@127.0.0.1:5432/assistant_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/13
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
